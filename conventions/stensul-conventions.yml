name: Stensul API Conventions
completeness: minimal
completeness_note: >-
  Stensul publishes no API reference and no machine-readable contract, so almost
  every cross-cutting semantic below is UNKNOWN rather than absent. An unknown
  here is a documentation gap on Stensul's side, not a claim that the behaviour
  does not exist in the product.
