rate_limit_signaling:
  headers: []
  status_on_exhaustion: unknown
  note: See rate-limits/stensul-rate-limits.yml.
reversibility:
  grade: unknown
  applicable: true
  applicable_reason: >-
    The APIs are not read-only. The User API explicitly de-provisions users —
    a destructive write — and the Content API distributes content to downstream
    systems, which is an outbound action with real effect.
  reversal_operations: []
  windows: []
  note: >-
    Stensul publishes no reversal operation, no undo, and no restore window for
    either API. Specifically: nothing states whether a user de-provisioned
    through the User API can be restored, or within what window, and nothing
    states whether content already pushed through the Content API can be
    recalled. Because no reference exists, this is graded `unknown` rather than
    `documented` or `verified` — a reversal path may well exist in the product
    and simply not be written down. NO window is asserted here, because inventing
    one for a de-provisioning API is exactly the error that would cost a customer
    a real account.
  what_would_close_this: >-
    A single sentence in the User API reference stating whether de-provisioning
    is soft-delete or hard-delete, and if soft, for how long the record is
    restorable.
dry_run_mode:
  supported: unknown
  note: Not published.
sandbox:
  present: false
  note: >-
    No test environment, test credentials, or sandbox tenant is publicly
    documented. sandbox/ is therefore not written.
