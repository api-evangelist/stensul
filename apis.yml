  detail: >-
    Stensul markets two named enterprise APIs on
    https://stensul.com/our-integrations/api-endpoints/ — a Content API and a User
    API — but every route from those pages ends at "Request a demo": there is no
    developer portal, no api./docs./developer. subdomain (all three fail DNS
    resolution), no API reference in the public Intercom help center, which
    exposes exactly one collection ("Integrations"), and no base URL, endpoint,
    scope or error published anywhere a machine can read.
