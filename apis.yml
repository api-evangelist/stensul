aid: stensul
name: Stensul
description: >-
  Stensul is an enterprise email and landing page creation platform — it calls the
  category "Governed Creation" — used by large marketing organizations to build,
  review, approve and deploy campaign assets without hand-coding HTML for every
  send. Marketers assemble emails and landing pages from brand-locked, developer-built
  modules; the platform runs the review and approval workflow, then pushes the
  finished asset into the ESP or marketing automation platform of record (Salesforce
  Marketing Cloud, Marketo, Adobe Campaign, Adobe Journey Optimizer, Oracle Eloqua,
  Braze, Iterable, Acoustic, Responsys, Epsilon PeopleCloud, Zeta and others).
  Stensul markets two enterprise APIs — a Content API for retrieving and distributing
  finished email content to any downstream system, and a User API for automating
  user provisioning and de-provisioning — both described as using OAuth
  server-to-server authentication with IP address allowlisting, with the User API
  additionally claiming support for SCIM provisioning standards. Neither API has a
  public reference, base URL, or machine-readable specification published on
  stensul.com; the endpoint pages are marketing descriptions that route to a sales
  conversation. The company was founded in 2015 and is headquartered in New York.
