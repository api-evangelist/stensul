apis:
- name: Stensul Content API
  description: >-
    Enterprise API for retrieving finalized Stensul email content and distributing
    it to any platform in a customer's ecosystem, removing the manual export step
    between Stensul and the downstream ESP/MAP. Stensul documents it publicly as
    using OAuth server-to-server authentication together with IP address
    allowlisting. No endpoint reference, base URL, or machine-readable contract is
    published on the public web; Stensul states a customer team builds and hosts
    the custom connection.
  humanURL: https://stensul.com/integrations/stensul-content-api/
  tags:
  - Content
  - Email
  - Integration
  properties:
  - type: Authentication
    url: authentication/stensul-authentication.yml
  - type: RateLimits
    url: rate-limits/stensul-rate-limits.yml
- name: Stensul User API
  description: >-
    Enterprise API for automating the provisioning, management and de-provisioning
    of Stensul users and their roles and permissions. Stensul's public integration
    page states it supports SCIM provisioning standards alongside OAuth
    server-to-server authentication and IP address allowlisting. The SCIM schema
    version, service provider configuration endpoint, and base URL are not
    published publicly, so the SCIM claim is recorded as a vendor assertion rather
    than a verified contract conformance.
  humanURL: https://stensul.com/integrations/stensul-user-api/
  tags:
  - Identity
  - User
  - Provisioning
  - SCIM
  tags_raw:
  - Identity
  - Users
  - Provisioning
  - SCIM
  properties:
  - type: Authentication
    url: authentication/stensul-authentication.yml
