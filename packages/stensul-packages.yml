name: Stensul Packages
summary: >-
  Stensul publishes NO client SDK on any public package registry. Eleven npm
  packages under the `stensul-*` name prefix ARE first-party — every one is
  maintained by three @stensul.com accounts — but all eleven are empty
  namespace placeholders: version 1.0.0 (1.0.1 for one), a single file, 207-219
  bytes unpacked, no description, no repository, no dependencies, all published
  within two days in January 2024. This is the signature of defensive
  dependency-confusion registration of internal package names, not a distributed
  client library. They are recorded here because they are genuinely Stensul's and
  a consumer searching npm for "stensul" will find them and may mistake
  `stensul-sdk` for a real SDK — it is not.
